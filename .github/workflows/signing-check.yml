# TEMPORARY: proves the signing import on a runner. Removed before merging.
name: Signing check
on:
  push:
    branches: [fix/ci-signing-import]
permissions:
  contents: read
jobs:
  import:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import signing certificate
        env:
          NOTCHSHOT_SIGNING_P12_BASE64: ${{ secrets.NOTCHSHOT_SIGNING_P12_BASE64 }}
          NOTCHSHOT_SIGNING_P12_PASSWORD: ${{ secrets.NOTCHSHOT_SIGNING_P12_PASSWORD }}
        run: script/ci_signing_keychain.sh import
      - name: Sign and verify a throwaway binary
        run: |
          cp /usr/bin/true "$RUNNER_TEMP/probe"
          codesign --force --sign "$NOTCHSHOT_SIGNING_IDENTITY" --timestamp=none --identifier com.bchewy.NotchShot.probe "$RUNNER_TEMP/probe"
          codesign --verify --strict "$RUNNER_TEMP/probe"
          codesign -dv "$RUNNER_TEMP/probe" 2>&1 | grep -E "^Authority|^TeamIdentifier"
      - name: Remove signing keychain
        if: always()
        run: script/ci_signing_keychain.sh cleanup
